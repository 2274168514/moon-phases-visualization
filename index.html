<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>月相演变可视化</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link rel="stylesheet" href="enhanced.css">
    <link rel="stylesheet" href="moon-styles.css">
</head>
<body>
    <!-- 紧凑的顶部控制栏 -->
    <header class="compact-header">
        <div class="compact-controls">
            <div class="title-section">
                <span class="moon-icon">🌙</span>
                <h1>月相演变可视化</h1>
            </div>

            <div class="control-section">
                <!-- 年度概览图 - 替代下拉框 -->
                <div class="overview-container">
                    <div class="overview-map" id="overview-map">
                        <map name="year-overview-map" id="year-overview-map">
                            <!-- 12个月的可点击区域，适应350px宽度和32px高度 -->
                            <area shape="rect" coords="0,0,28,32" alt="1月" data-month="0">
                            <area shape="rect" coords="29,0,57,32" alt="2月" data-month="1">
                            <area shape="rect" coords="58,0,86,32" alt="3月" data-month="2">
                            <area shape="rect" coords="87,0,115,32" alt="4月" data-month="3">
                            <area shape="rect" coords="116,0,144,32" alt="5月" data-month="4">
                            <area shape="rect" coords="145,0,173,32" alt="6月" data-month="5">
                            <area shape="rect" coords="174,0,202,32" alt="7月" data-month="6">
                            <area shape="rect" coords="203,0,231,32" alt="8月" data-month="7">
                            <area shape="rect" coords="232,0,260,32" alt="9月" data-month="8">
                            <area shape="rect" coords="261,0,289,32" alt="10月" data-month="9">
                            <area shape="rect" coords="290,0,318,32" alt="11月" data-month="10">
                            <area shape="rect" coords="319,0,350,32" alt="12月" data-month="11">
                        </map>
                        <!-- 月份覆盖层用于高亮显示 -->
                        <div class="month-overlay" id="month-overlay"></div>
                    </div>
                </div>

                <div class="view-controls">
                    <button id="grid-view-btn" class="mini-btn active">网格</button>
                    <a href="moon-animation-fixed.html" class="mini-btn" style="text-decoration: none; color: inherit; display: inline-block;">动画演示</a>
                </div>
            </div>
        </div>
    </header>

    <!-- 主内容区 - 左右两栏布局 -->
    <main class="main-content">
        <div class="content-layout">
            <!-- 左侧：月相网格 -->
            <section class="left-panel">
                <div id="grid-view" class="view-container">
                    <div class="section-header">
                        <h2 id="grid-title">2024年一月 月相观测记录</h2>
                        <button id="lunar-toggle" class="lunar-toggle-btn">农历</button>
                    </div>
                    <div class="moon-grid" id="moon-grid">
                        <!-- 月相网格将通过JavaScript动态生成 -->
                    </div>
                </div>

                <div id="timeline-view" class="view-container hidden">
                    <div class="section-header">
                        <h2>月相演变时间线</h2>
                    </div>
                    <div class="timeline-container" id="timeline-container">
                        <!-- 时间线视图将通过JavaScript动态生成 -->
                    </div>
                </div>
            </section>

            <!-- 右侧：数据可视化图表 -->
            <section class="right-panel">
                <div class="charts-header">
                    <h2>数据分析</h2>
                    <div class="chart-controls">
                        <select id="parameter-select" class="parameter-select">
                            <option value="illumination">月相照明度变化</option>
                            <option value="distance">地月距离变化</option>
                            <option value="diameter">视直径变化</option>
                            <option value="distribution">月相分布统计</option>
                            <option value="relationship">照明度-距离关系</option>
                        </select>
                        <select id="chart-type-select" class="chart-type-select">
                            <option value="line">折线图</option>
                            <option value="scatter">散点图</option>
                            <option value="bar">柱状图</option>
                        </select>
                    </div>
                </div>

                <!-- 单张大图表容器 -->
                <div class="main-chart-container">
                    <div class="chart-title" id="chart-title">月相照明度变化</div>
                    <div class="main-chart" id="main-chart"></div>
                </div>

                <!-- 参数介绍区域 -->
                <div class="parameter-info">
                    <div class="parameter-content" id="parameter-content">
                        <div class="parameter-item" data-parameter="illumination">
                            <h4>月相照明度变化</h4>
                            <p>显示月亮表面被太阳照亮部分的比例变化。照明度从0%（新月）到100%（满月）周期性变化，反映了月相的完整周期。</p>
                            <ul>
                                <li><strong>新月：</strong>照明度0%，月亮完全不可见</li>
                                <li><strong>上弦月：</strong>照明度50%，右半部分可见</li>
                                <li><strong>满月：</strong>照明度100%，整个月面可见</li>
                                <li><strong>下弦月：</strong>照明度50%，左半部分可见</li>
                            </ul>
                        </div>
                    </div>
                </div>
              </section>
        </div>
    </main>

    <!-- 悬浮信息面板 -->
    <div id="hover-panel" class="hover-panel hidden">
        <div class="hover-content">
            <div class="hover-moon" id="hover-moon">
                <!-- 月相圆形将通过JavaScript生成 -->
            </div>
            <div class="hover-info">
                <h3 id="hover-phase-name">满月</h3>
                <div class="hover-details">
                    <p><span class="detail-label">日期：</span><span id="hover-date">2024-01-15</span></p>
                    <p><span class="detail-label">农历：</span><span id="hover-lunar-date">腊月初五</span></p>
                    <p><span class="detail-label">照明度：</span><span id="hover-illumination">100%</span></p>
                    <p><span class="detail-label">地月距离：</span><span id="hover-distance">384,400 km</span></p>
                    <p><span class="detail-label">月相进度：</span><span id="hover-progress">50.0%</span></p>
                </div>
            </div>
        </div>
    </div>

    <!-- 加载JavaScript -->
    <script src="lunar-calendar.js"></script>
    <script src="local-moon-phases.js"></script>
    <script src="moon-visualization-final.js"></script>
</body>
</html>
